server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 해시 자산 장기 캐시 (1년)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 캐시 안 함
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}